name: Auto News Bot 24/7

on:
  schedule:
    # Chạy mỗi 30 phút một lần
    - cron: '*/30 * * * *'
  workflow_dispatch: # Nút bấm để bạn có thể test chạy thử bất kỳ lúc nào

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run News Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: node index.mjs
